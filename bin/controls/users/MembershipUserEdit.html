<form name="quiqqer-memberships-membershipuseredit">
    <div class="quiqqer-memberships-membershipuseredit-field">
        <label class="quiqqer-memberships-membershipuseredit-label" for="membershipuseredit-beginDate">
            {{labelBeginDate}}
        </label>
        <input type="datetime"
               id="membershipuseredit-beginDate"
               class="quiqqer-memberships-membershipuseredit-input quiqqer-memberships-membershipuseredit-attribute"
               name="beginDate" placeholder="YYYY-MM-DD">
    </div>

    <div class="quiqqer-memberships-membershipuseredit-field">
        <label class="quiqqer-memberships-membershipuseredit-label" for="membershipuseredit-endDate">
            {{labelEndDate}}
        </label>
        <input type="datetime"
               id="membershipuseredit-endDate"
               class="quiqqer-memberships-membershipuseredit-input quiqqer-memberships-membershipuseredit-attribute"
               name="endDate" placeholder="YYYY-MM-DD">
    </div>

    <div class="quiqqer-memberships-membershipuseredit-field quiqqer-memberships-membershipuseredit-field-checkbox">
        <label class="quiqqer-memberships-membershipuseredit-checkbox-wrap" for="membershipuseredit-cancelled">
            <input type="checkbox"
                   id="membershipuseredit-cancelled"
                   class="quiqqer-memberships-membershipuseredit-checkbox quiqqer-memberships-membershipuseredit-attribute"
                   name="cancelled">
            <span class="quiqqer-memberships-membershipuseredit-checkbox-label">
                {{labelCancelled}}
            </span>
        </label>
    </div>

    <div class="quiqqer-memberships-membershipuseredit-submit"></div>
</form>
